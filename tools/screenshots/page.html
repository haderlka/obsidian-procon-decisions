<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro/Con screenshot</title>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="styles.css">
<style>
/* Obsidian default theme values (approximate) */
body {
	--font-text-size: 16px;
	--font-interface: "Segoe UI", system-ui, sans-serif;
	--h1-size: 1.802em;
	margin: 0;
	font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
	font-size: 16px;
	line-height: 1.5;
	background: var(--background-primary);
	color: var(--text-normal);
}
body.theme-light {
	--color-green: #08b94e; --color-green-rgb: 8, 185, 78;
	--color-red: #e93147; --color-red-rgb: 233, 49, 71;
	--color-yellow: #e0ac00; --color-yellow-rgb: 224, 172, 0;
	--color-pink: #d53984;
	--interactive-accent: #8a5cf5; --interactive-accent-rgb: 138, 92, 245;
	--background-primary: #ffffff;
	--background-modifier-border: #e0e0e0;
	--background-modifier-hover: rgba(0, 0, 0, 0.067);
	--background-modifier-border-focus: #bdbdbd;
	--text-normal: #222222; --text-muted: #5c5c5c; --text-faint: #ababab;
}
body.theme-dark {
	--color-green: #44cf6e; --color-green-rgb: 68, 207, 110;
	--color-red: #fb464c; --color-red-rgb: 251, 70, 76;
	--color-yellow: #e0de71; --color-yellow-rgb: 224, 222, 113;
	--color-pink: #fa99cd;
	--interactive-accent: #8a5cf5; --interactive-accent-rgb: 138, 92, 245;
	--background-primary: #1e1e1e;
	--background-modifier-border: #363636;
	--background-modifier-hover: rgba(255, 255, 255, 0.075);
	--background-modifier-border-focus: #5a5a5a;
	--text-normal: #dadada; --text-muted: #b3b3b3; --text-faint: #666666;
}
.note { max-width: 760px; margin: 0 auto; padding: 28px 32px 30px; }
body.is-mobile { background: #d9dbe0; }
body.is-mobile .note {
	box-sizing: border-box;
	width: 375px;
	margin: 24px auto;
	padding: 22px 14px 26px;
	border-radius: 34px;
	border: 8px solid #1f1f22;
	background: var(--background-primary);
	--h1-size: 1.6em;
}
h1 { font-size: var(--h1-size); font-weight: 700; line-height: 1.2; margin: 0 0 12px; }
p { margin: 0 0 14px; color: var(--text-normal); }
p.after { margin: 14px 0 0; color: var(--text-muted); }
.procon, .procon * { animation: none !important; transition: none !important; }
/* Simulated hover for the "editing" screenshot */
.procon-item.force-hover .procon-actions { opacity: 1; transform: none; }
.procon-item.force-hover .procon-grip { opacity: 1; }
.procon-item.force-hover { transform: translateY(-1px); box-shadow: 0 6px 16px -8px rgba(var(--pc-side-rgb), .45); }
</style>
</head>
<body>
<div class="note">
	<h1 id="h"></h1>
	<p id="intro"></p>
	<div id="host"></div>
	<p class="after" id="after"></p>
</div>
<script>
	const q = new URLSearchParams(location.search);
	const laptop = q.get("set") === "laptop";
	document.getElementById("h").textContent = laptop ? "New laptop?" : "Moving to Berlin";
	document.getElementById("intro").textContent = laptop
		? "Trying to decide whether an upgrade is worth it this year."
		: "The job offer is on the table. Here is how the arguments stack up:";
	document.getElementById("after").textContent = laptop ? "" : "Next step: talk it through with Sam on Friday.";
</script>
<script src="bundle.js"></script>
</body>
</html>
